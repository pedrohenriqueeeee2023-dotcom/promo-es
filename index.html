<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achado de hoje | Achados 01</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0204">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--gold:#D9B46C;--muted:#A8A1A3;--green:#25D366}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 32%,#2A0A12 0%,#0E0507 60%,#080405 100%);color:#fff;font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px 16px 24px}

/* promoções passando no fundo */
.rail{position:fixed;top:0;bottom:0;width:min(34vw,240px);overflow:hidden;opacity:.16;filter:grayscale(1) blur(1.4px);pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
.rail.l{left:-5vw;transform:rotate(-4deg)}
.rail.r{right:-5vw;transform:rotate(4deg)}
.track{display:flex;flex-direction:column;gap:12px;animation:sobe 40s linear infinite}
.rail.r .track{animation-name:desce;animation-duration:46s}
@keyframes sobe{to{transform:translateY(-50%)}}
@keyframes desce{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.promo{background:#1A1A1A;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px;font-size:11px;line-height:1.35;color:#DDD}
.promo .img{height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:6px;background:#111}
.promo b{display:block;font-size:11.5px}
.promo s{color:#888}
.promo .por{color:#DDD;font-weight:800;font-size:13px}
.fade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 60% 62% at 50% 50%,rgba(8,4,5,.92),rgba(8,4,5,.35) 75%,transparent)}

main{position:relative;z-index:2;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tag{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#EDEDED;font-size:11px;font-weight:700;letter-spacing:.14em}
.tag svg{width:14px;height:14px}

.palco{position:relative;width:280px;height:min(40vh,320px);margin-top:14px;display:flex;align-items:center;justify-content:center}
.palco::before{content:"";position:absolute;width:82%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(217,180,108,.3);background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,0) 68%)}
.palco img{position:relative;height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(0,0,0,.7))}

.tipo{margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.28em;color:var(--muted)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:52px;line-height:1;color:var(--gold)}
.sub{font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}

/* bloco de preço + botão, bem juntos */
.oferta{width:100%;margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
.de{font-size:15px;color:var(--muted)}
.por{font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.desc{margin-top:2px;color:var(--gold);font-size:14px;font-weight:700}
.btn{width:100%;margin-top:12px;min-height:60px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:18px;background:var(--green);color:#04230F;font-size:17px;font-weight:800;text-decoration:none;box-shadow:0 12px 30px rgba(37,211,102,.35);animation:pulse 1.8s infinite}
.btn svg{width:24px;height:24px;flex:none}
.prova{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:500;color:var(--muted)}
.prova svg{width:14px;height:14px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.btn,.track{animation:none}}
</style>
</head>
<body>
<div class="rail l" aria-hidden="true"><div class="track"></div></div>
<div class="rail r" aria-hidden="true"><div class="track"></div></div>
<div class="fade"></div>

<main>
  <span class="tag">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.5 2.2 2.5C11 8 11.5 5.5 12 3z"/></svg>
    PREÇO IMPERDÍVEL
  </span>

  <div class="palco"><img class="js-foto" alt=""></div>

  <span class="tipo js-tipo"></span>
  <h1 class="js-nome"></h1>
  <span class="sub js-sub"></span>

  <div class="oferta">
    <span class="de">De <s>R$ <span class="js-de"></span></s></span>
    <span class="por">R$ <span class="js-por"></span></span>
    <span class="desc">Você economiza R$ <span class="js-eco"></span> (<span class="js-off"></span>)</span>

    <a class="btn js-grupo" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35zM12.04 21.5a9.45 9.45 0 0 1-4.82-1.32l-.35-.21-3.58.94.96-3.49-.23-.36a9.43 9.43 0 0 1-1.45-5.03c0-5.22 4.25-9.46 9.48-9.46 2.53 0 4.91.99 6.7 2.78a9.4 9.4 0 0 1 2.77 6.7c0 5.22-4.25 9.46-9.47 9.46zm8.06-17.53A11.32 11.32 0 0 0 12.04.63C5.76.63.65 5.74.65 12.02c0 2 .52 3.96 1.52 5.69L.55 23.630l6.05-1.59a11.37 11.37 0 0 0 5.44 1.39c6.28 0 11.39-5.11 11.39-11.39 0-3.04-1.19-5.9-3.34-8.07z"/></svg>
      Entrar no grupo para pegar o link
    </a>
  </div>

  <p class="prova">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Últimas vagas · atualizado hoje às <span class="js-hora"></span>
  </p>
</main>

<script>
(function(){
  var L = PRODUTOS, p = L[new URLSearchParams(location.search).get('p')] || L[Object.keys(L)[0]];
  function num(v){ return parseFloat(String(v).replace(/\./g,'').replace(',','.')); }
  function brl(n){ return n.toFixed(2).replace('.', ','); }
  function fill(s, t){ document.querySelectorAll(s).forEach(function(el){ el.textContent = t; }); }
  var de = num(p.de), por = num(p.por);
  fill('.js-tipo', p.tipo || ''); fill('.js-nome', p.nome); fill('.js-sub', p.sub || '');
  fill('.js-de', p.de); fill('.js-por', p.por);
  fill('.js-eco', brl(de - por)); fill('.js-off', '-' + Math.round((1 - por/de) * 100) + '%');
  fill('.js-hora', ATUALIZADO);
  var f = document.querySelector('.js-foto'); f.src = p.foto; f.alt = (p.tipo || '') + ' ' + p.nome;
  document.title = p.nome + ' por R$ ' + p.por + ' | Achados 01';

  // Promoções passando no fundo (ilustrativas)
  var P = [
    ['🎧','Fone Bluetooth','299,90','119,90'], ['👟','Tênis de corrida','399,99','179,99'],
    ['⌚','Smartwatch GPS','599,00','239,00'], ['🧴','Kit skincare','189,90','79,90'],
    ['💄','Kit maquiagem','159,90','69,90'],   ['👜','Bolsa feminina','249,90','99,90'],
    ['🍳','Air fryer 5L','549,90','249,90'],   ['💍','Kit bijuterias','89,90','34,90'],
    ['🔊','Caixa de som','349,00','159,00'],   ['🪞','Espelho com LED','199,90','89,90']
  ];
  function card(x){ return '<div class="promo"><div class="img">'+x[0]+'</div><b>'+x[1]+'</b><s>R$ '+x[2]+'</s><br><span class="por">R$ '+x[3]+'</span></div>'; }
  var tr = document.querySelectorAll('.track');
  [P, P.slice(5).concat(P.slice(0,5))].forEach(function(l, i){ var h = l.map(card).join(''); tr[i].innerHTML = h + h; });

  // Clique: dispara CompleteRegistration e depois abre o grupo
  document.querySelectorAll('.js-grupo').forEach(function(a){
    a.href = LINK_GRUPO;
    a.addEventListener('click', function(e){
      e.preventDefault();
      if (window.fbq) fbq('track', 'CompleteRegistration', { content_name: p.nome });
      setTimeout(function(){ location.href = LINK_GRUPO; }, 300);
    });
  });
})();
</script>
</body>
</html>
