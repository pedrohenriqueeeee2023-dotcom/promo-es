<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achado de hoje | Achados 01</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120308">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#5a0d1e 0%,#120308 65%);color:#fff;font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px 16px}
main{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tag{font-size:12px;font-weight:800;letter-spacing:.12em;color:#FFB3C7}
.foto{max-width:78%;max-height:42vh;object-fit:contain;background:#fff;border-radius:20px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
h1{font-size:24px;line-height:1.2;font-weight:800}
h1 small{display:block;font-size:15px;color:#E8C7CF;font-weight:700;margin-top:4px}
.preco{display:flex;align-items:baseline;gap:10px}
.preco s{color:#B9959E;font-size:16px}
.preco b{font-size:34px;color:#3EE884}
.preco i{font-style:normal;background:#fff;color:#7a0f24;font-weight:800;font-size:13px;border-radius:6px;padding:2px 7px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:16px;background:linear-gradient(180deg,#34E37A,#1FB85A);color:#032411;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 10px 30px rgba(37,211,102,.35)}
.prova{font-size:13px;color:#E8C7CF;font-weight:700}
</style>
</head>
<body>
<main>
  <span class="tag">🎬 PRODUTO DO VÍDEO</span>
  <img class="foto js-foto" alt="">
  <h1><span class="js-nome"></span><small class="js-sub"></small></h1>
  <div class="preco"><s>R$ <span class="js-de"></span></s><b>R$ <span class="js-por"></span></b><i class="js-off"></i></div>
  <a class="btn js-grupo" href="#">Entrar no grupo para pegar o link</a>
  <p class="prova">👥 <span class="js-membros"></span> membros · Atualizado hoje às <span class="js-hora"></span></p>
</main>
<script>
(function(){
  var L = PRODUTOS, p = L[new URLSearchParams(location.search).get('p')] || L[Object.keys(L)[0]];
  function num(v){ return parseFloat(String(v).replace(/\./g,'').replace(',','.')); }
  function fill(s, t){ document.querySelectorAll(s).forEach(function(el){ el.textContent = t; }); }
  var off = Math.round((1 - num(p.por)/num(p.de)) * 100);
  fill('.js-nome', p.nome); fill('.js-sub', p.sub || '');
  fill('.js-de', p.de); fill('.js-por', p.por); fill('.js-off', off > 0 ? '-' + off + '%' : '');
  fill('.js-membros', MEMBROS); fill('.js-hora', ATUALIZADO);
  var f = document.querySelector('.js-foto'); f.src = p.foto; f.alt = p.nome;
  document.title = p.nome + ' por R$ ' + p.por + ' | Achados 01';

  // Clique: dispara CompleteRegistration e depois abre o grupo
  document.querySelectorAll('.js-grupo').forEach(function(a){
    a.href = LINK_GRUPO;
    a.addEventListener('click', function(e){
      e.preventDefault();
      if (window.fbq) fbq('track', 'CompleteRegistration', { content_name: p.nome });
      setTimeout(function(){ location.href = LINK_GRUPO; }, 300);
    });
  });
})();
</script>
</body>
</html>
